<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Asset App</title>
<link rel="icon" type="image/png" href="https://isitglobal.com">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background-color: #ffffff; /* Match this to your app's background color */
  }

  /* The wrapper acts as a window pane, cutting off anything pushed outside it */
  .iframe-container {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  /* Pushes the top of the iframe up to hide the banner, then stretches it to cover the gap */
  .iframe-container iframe {
    position: absolute;
    top: -48px; /* Cuts off the top 48px banner area */
    left: 0;
    width: 100%;
    height: calc(100vh + 48px); /* Adds back the missing height at the bottom */
    border: none;
  }
</style>
</head>
<body>

  <div class="iframe-container">
    <iframe src="https://apps.powerapps.com/play/e/f7649ce4-b81d-e57e-831a-22aaefcf6d5d/a/c05bfd21-a2b8-4590-84a0-6de7aed27e85?tenantId=ea408819-0834-43bd-87ef-2dc4be3e44c0&hint=e73b33b4-e1f6-4b46-89b3-fd93c9f01d3a&sourcetime=1794297757814&source=portal?hidenavbar=true"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
